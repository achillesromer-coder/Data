name: JPL Source Capture and Comparative Windows

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches:
      - main
      - ops/jpl-source-capture
    paths:
      - .github/workflows/jpl-sbdb-source-capture.yml
      - scripts/fetch_jpl_source_batch.py
      - scripts/fetch_jpl_horizons_windows.py
      - scripts/fetch_jpl_neighbour_batch.py
      - scripts/fetch_jpl_neighbour_horizons.py

permissions:
  contents: write

concurrency:
  group: jpl-source-capture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    name: Capture JPL priority and neighbour comparison data
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and normalize priority SBDB payloads
        shell: bash
        run: |
          set +e
          python scripts/fetch_jpl_source_batch.py
          code=$?
          set -e
          if [ "$code" -gt 2 ]; then
            exit "$code"
          fi

      - name: Fetch and normalize priority Horizons comparative windows
        shell: bash
        run: |
          set +e
          python scripts/fetch_jpl_horizons_windows.py
          code=$?
          set -e
          if [ "$code" -gt 2 ]; then
            exit "$code"
          fi

      - name: Fetch and normalize bounded neighbour SBDB payloads
        shell: bash
        run: |
          set +e
          python scripts/fetch_jpl_neighbour_batch.py
          code=$?
          set -e
          if [ "$code" -gt 2 ]; then
            exit "$code"
          fi

      - name: Fetch and normalize bounded neighbour Horizons windows
        shell: bash
        run: |
          set +e
          python scripts/fetch_jpl_neighbour_horizons.py
          code=$?
          set -e
          if [ "$code" -gt 2 ]; then
            exit "$code"
          fi

      - name: Commit changed JPL source snapshots
        shell: bash
        run: |
          git config user.name "cognigrex-source-capture"
          git config user.email "actions@users.noreply.github.com"
          git add data/jpl/sbdb/latest data/jpl/horizons/latest data/jpl/neighbours/sbdb/latest data/jpl/neighbours/horizons/latest
          if git diff --cached --quiet; then
            echo "No JPL source changes detected."
            exit 0
          fi
          git commit -m "Refresh JPL priority and neighbour comparison data"
          git push origin "HEAD:${GITHUB_REF_NAME}"
