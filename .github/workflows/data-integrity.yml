name: Data Integrity

on:
  pull_request:
    branches:
      - main
    paths:
      - "data/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "README.md"
  push:
    branches:
      - main
      - "ops/**"
      - "data/**"
      - "fix/**"
    paths:
      - "data/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository data contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1f # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.12"

      - name: Compile Python scripts
        run: python -m compileall -q scripts tests

      - name: Test repository data validator
        run: python -m unittest discover -s tests -v

      - name: Validate committed data
        run: python scripts/validate_repository_data.py

      - name: Validate InterSol cross-file contracts
        run: python scripts/validate_intersol_contracts.py
